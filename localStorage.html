<script>
const saveKey = window.location.href;

window.addEventListener('beforeunload', () => {
  const data = JSON.stringify(window.gameData || {});
  localStorage.setItem(saveKey, data);
});

window.addEventListener('load', () => {
  const saved = localStorage.getItem(saveKey);
  if(saved) {
    window.gameData = JSON.parse(saved);
  } else {
    window.gameData = {};
  }
});
</script>
